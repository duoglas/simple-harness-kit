name: CI

on:
  pull_request:
    branches: [master]

# 避免同一 PR 重复构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限
permissions:
  contents: read

jobs:
  test:
    name: 脚本测试矩阵
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 代码检出
        uses: actions/checkout@v4

      - name: 运行测试套件
        run: bash tests/scripts/run-all.sh

  validate-no-personal-paths:
    name: 校验无个人路径
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 代码检出
        uses: actions/checkout@v4

      - name: 扫描绝对路径泄漏
        run: node scripts/ci/validate-no-personal-paths.js .
